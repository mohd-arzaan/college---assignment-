<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html character entities</title>
  </head>
  <body>
    <h1>html character entities</h1>
    <p>copyright : &copy; 2026</p>
    <p>registered : &reg; </p>
    <p>trademark : &trade; </p>
    <p>less than : &lt; </p>
    <p>greater than : &gt; </p>
    <p>ampersand : &amp; </p>
    <p> quotation mark : &quot; </p>
    <p>mathmatical symbols : &plusmn; &times; &divide; </p>
    <p>currency : &dollar; &pound; &euro; </p>
  </body>
</html>
