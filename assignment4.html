<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>college event gallery</title>
  </head>
  <body>
    <h1>college event gallery</h1>

      <img
        src="inauguration.jpg"
        alt="principal inauguration the college event "

      />
      <figcaption>event inauguration</figcaption>

    <figure>
      <img
        src="cultural.jpg"

      />

      <img
        src="prize.jpg"

      />
      <figcaption>prize distribution</figcaption>
    </figure>
